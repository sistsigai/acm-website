name: Test A2 SSH

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/github_deploy
          chmod 600 ~/.ssh/github_deploy

          eval "$(ssh-agent -s)"

          cat > ~/.ssh/askpass.sh <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_PASSPHRASE"
          EOF

          chmod 700 ~/.ssh/askpass.sh

          export SSH_ASKPASS="$HOME/.ssh/askpass.sh"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0

          ssh-add ~/.ssh/github_deploy

      - name: Add server to known hosts
        run: |
          ssh-keyscan \
            -p "${{ secrets.CPANEL_PORT }}" \
            "${{ secrets.CPANEL_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh \
            -o BatchMode=yes \
            -p "${{ secrets.CPANEL_PORT }}" \
            "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" \
            "whoami && pwd"